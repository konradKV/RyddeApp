<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hei!!!</title>
        <link rel="stylesheet" href="styles/styling.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet"/>
    </head>
    <body>
        <header>
            <div class="KonradFREEheadTuff">
                <h1>Daglig oppgaver</h1>

                <!-- Only ONE buttonslayout -->
                <div class="buttonslayout">
                    <button>
                        <img src="img/podium.png" alt="Leaderboard" />
                    </button>
                    <button><img src="img/task.png" alt="Tasks" /></button>
                    <button><img src="img/home.png" alt="Home" /></button>
                </div>
            </div>
        </header>

        <!--Leaderboard -->
        <div id="page-leaderboard" class="page">
            <div class = "Wi">
                <h2>Leaderboard</h2>
                <p>Topplisten kommer her...</p>
            <div>
        </div>

        <div id="page-tasks" class="page">
            <div class="KONRADINSANEHEAD">
                <button id="btn-create">+ Oppgave</button>
                <div id="utskrift"></div>
            </div>
        </div>

        <div id="page-create" class="page">
            <h2>Lag oppgave</h2>
            <div id="left">
                <h1>Skriv inn din melding her</h1>
                <form id="skjema">
                <div class="lable-layout">
                    <label for="taskName">Oppgave navn:</label>
                    <input type="text" id="taskName" required>

                    <label for="taskDescription">Oppgave beskrivelse:</label>
                    <textarea id="taskDescription" class="big-input" required></textarea>

                    <label for="creatorName">Ditt navn:</label>
                    <input type="text" id="creatorName" required>

                    <button type="submit">Lag oppgave</button>
                </div>
                </form>
            </div>
        </div>

        <div id="page-home" class="page">
            <h2>Min side</h2>
            <p>Her kommer info om brukeren...</p>
        </div>
        <main>
    </body>
</html>

<script>
    const buttons = document.querySelectorAll(".buttonslayout button");
    const pages = document.querySelectorAll(".page");

    // FINAL showPage() — only one version
    function showPage(id, index) {
        // Hide all pages
        pages.forEach((p) => p.classList.remove("active"));
        document.getElementById(id).classList.add("active");

        // If index is null → skip updating bottom buttons
        if (index === null) return;

        // Update selected bottom button
        buttons.forEach((b) => b.classList.remove("selected"));
        buttons[index].classList.add("selected");
    }

    // Bottom navigation buttons
    buttons[0].addEventListener("click", () => showPage("page-leaderboard", 0));
    buttons[1].addEventListener("click", () => showPage("page-tasks", 1));
    buttons[2].addEventListener("click", () => showPage("page-home", 2));

    // Internal “+ Oppgave” button
    document
        .getElementById("btn-create")
        .addEventListener("click", () => showPage("page-create", null));


    // When "Lag oppgave" inside the form is submitted → go to default page
    document.getElementById("skjema").addEventListener("submit", (event) => {
        event.preventDefault(); // prevents page reload

        // OPTIONAL: Insert your code here to save the task or send it to the server

        // Go back to default page
        showPage("page-tasks", 1);
    });


    //default page
    showPage("page-tasks", 1);

    const utskrift = document.getElementById("utskrift");
    async function displayTasks() {
        utskrift.innerHTML = '';
        const response = await fetch("/getTasks");
        const tasks = await response.json();
        for (let task of tasks) {
            const div = document.createElement("div");
            div.dataset.taskid = task.id;
            const nameSpan = document.createElement("span");
            const descrSpan = document.createElement("span");
            const creatorSpan = document.createElement("span");

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "✖"
            deleteBtn.classList.add("delete-btn")
            deleteBtn.dataset.taskid = task.id;

            deleteBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              slettOppgave(e);
            })

            nameSpan.classList.add("task-name");
            descrSpan.classList.add("task-description");
            creatorSpan.classList.add("creator-name");

            nameSpan.textContent = task.name;
            descrSpan.textContent = task.description;
            creatorSpan.textContent = "Laget av: " + task.creatorUser;

            div.appendChild(deleteBtn)
            div.appendChild(nameSpan);
            div.appendChild(document.createElement("br"));
            div.appendChild(creatorSpan);
            div.appendChild(document.createElement("br"));
            div.appendChild(descrSpan);
            utskrift.appendChild(div)
        }
    }
    const skjema = document.getElementById('skjema');
    const taskNameEl = document.getElementById('taskName');
    const creatorNameEl = document.getElementById('creatorName');
    const taskDescriptionEl = document.getElementById('taskDescription')

    skjema.addEventListener('submit', addTask);
    async function addTask(e){
      e.preventDefault();
      const taskName = taskNameEl.value.trim()
      const creatorName = creatorNameEl.value.trim()
      const taskDescription = taskDescriptionEl.value.trim()

      const res = await fetch('/addTask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ taskName, creatorName, taskDescription })
         });
      displayTasks()
    }
    async function slettOppgave(e) {
        console.log("sletter oppgave");

        const deleteTask = await fetch("/deleteTask", {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: e.target.dataset.taskid }),

        });

        displayTasks();
    }

    displayTasks()
</script>
