<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hei!!!</title>
        <link rel="stylesheet" href="styles/styling.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Jua&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header>
            <div class="HeaderButtons">
                <select id="user-selection" name="selectedUser"></select>
                <h1>Daglig oppgaver</h1>
                <div class="buttonslayout">
                    <button id="btn-leaderboard">
                        <img src="img/podium.png" alt="" />
                    </button>

                    <button id="btn-tasks">
                        <img src="img/task.png" alt="" />
                    </button>

                    <button id="btn-home">
                        <img src="img/home.png" alt="" />
                    </button>
                </div>
            </div>
        </header>

        <!--Leaderboard -->
        <div id="page-leaderboard" class="page">
            <div class="Leaderboard">
                <h2>Leaderboard</h2>
            </div>
        </div>

        <div id="page-tasks" class="page">
            <div class="Task-Creation">
                <button id="btn-create">+ Oppgave</button>
                <div id="utskrift"></div>
            </div>
        </div>

        <div id="page-create" class="page">
            <div id="left">
                <h1>Oprett oppgave:</h1>
                <form id="skjema">
                    <div class="lable-layout">
                        <label for="taskName">Oppgave navn:</label>
                        <input type="text" id="taskName" required />

                        <label for="taskDescription"
                            >Oppgave beskrivelse:</label
                        >
                        <textarea
                            id="taskDescription"
                            class="big-input"
                            required
                        ></textarea>

                        <select name="difficulty" id="difficultySelect">
                            <option value="difficulty1">1</option>
                            <option value="difficulty2">2</option>
                            <option value="difficulty3">3</option>
                        </select>

                        <button type="submit">Lag oppgave</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="page-home" class="page">
            <h2>Min side</h2>
            <div id="pointsUtskrift"></div>
            <div id="completedUtskrift"></div>
        </div>

        <div id="page-doing" class="page">
            <div id="active-task"></div>
            <button>Finished</button>
        </div>
        <!--Lyder
        <audio id="clickSound" src="sounds/"></audio>
        <audio id="hoverSound" src="sounds/"></audio> -->

        <script src="scripts/konrad.js"></script>
    </body>
</html>
